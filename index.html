<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style>
<title>Dialect Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
/* Layout: one app shell that reflows by its own width (container queries) — phone: bottom bar; tablet: side rail; laptop: sidebar + context panel.
   Single light theme by choice: a ward app used under bright clinical lighting. */
:root{
  --teal:#105a5c; --teal-2:#0c4648; --teal-soft:#e4efee; --teal-line:#cfdcdb;
  --orange:#b4531f; --brown:#7a3512; --cream:#fff5e6; --cream-line:#efd9bb; --peach:#fde9dc;
  --ink:#1a2423; --muted:#5d6a68; --faint:#8a9694; --line:#e2e7e6; --bg:#f2f4f3; --card:#ffffff;
  --good:#1f6b3a; --good-soft:#eaf4ec; --bad:#a6332a; --bad-soft:#fbeceb; --amber:#8a5a00;
  --t1:#1f6fb8; --t2:#2e8a4b; --t3:#7d55b8; --t4:#c23c2a; --t5:#a87a07; --t6:#56687a;
  --stage:#dde3e2;
  --f-ui:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-zh:"Noto Sans HK", "Noto Sans CJK HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0b37e;outline-offset:2px}
.zh{font-family:var(--f-zh)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- preview stage ---------- */
.toolbar{display:none}
body.staged .toolbar{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.toolbar .lbl{font-size:13px;color:var(--muted);font-weight:600}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.stage{position:relative}
body.staged .stage{display:flex;justify-content:center;padding:4px 16px 24px}
.device{position:relative;background:var(--bg);overflow:hidden;width:100%;height:100vh;height:100dvh}
body.staged .device{border-radius:28px;box-shadow:0 0 0 10px #1b1f1f,0 18px 50px rgba(0,0,0,.25);transform-origin:top center;flex:none}
body.staged .device.phone{border-radius:52px;box-shadow:0 0 0 11px #1b1f1f,0 18px 50px rgba(0,0,0,.25)}
.island{display:none}
body.staged .device.phone .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#0b0d0d;z-index:50}
.app{container-type:inline-size;height:100%;width:100%;--tg:calc(env(safe-area-inset-top,0px) + 12px)}
body.staged .phone .app{--tg:52px}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100%}
.main{flex:1;display:flex;min-height:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;-webkit-overflow-scrolling:touch}
.col{max-width:560px;margin:0 auto;padding:0 16px 28px}
.side,.ctx{display:none}
.tabbar{display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--faint);min-width:62px;padding:4px 0}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--teal);font-weight:700}

/* top spacing for the island on phones */
.topgap{height:var(--tg)}

/* sub-screen header */
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:calc(var(--tg) + 4px) 16px 14px;margin:0 -16px 16px}
.back{width:44px;height:44px;border-radius:22px;background:#eef1f0;display:flex;align-items:center;justify-content:center;flex:none}
.bar h1{font-size:22px;font-weight:800;margin:0;line-height:1.15;text-wrap:balance}
.bar p{margin:2px 0 0;font-size:14px;color:var(--muted)}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.hl{border:2px solid var(--teal)}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0}
.eyebrow.or{color:var(--orange)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;font-size:18px;font-weight:700;width:100%}
.btn.pri{background:var(--teal);color:#fff}
.btn.sec{border:1.5px solid var(--teal);color:var(--teal);background:#fff}
.btn.warm{background:var(--brown);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--teal-line);font-size:15px;font-weight:600;color:var(--teal);background:#fff}
.pill.solid{background:var(--teal);border-color:var(--teal);color:#fff}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;background:#f5ddb5;color:#4d2b0a}
.tag.ta{background:#ebe4f6;color:#4b3378}
.muted{color:var(--muted)}
.sm{font-size:13px}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.lg{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600}
.lgline{font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.linkbtn{color:var(--teal);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.linkbtn svg{width:16px;height:16px}

/* phrases */
.phr{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:flex-end}
.syl{display:flex;flex-direction:column;align-items:stretch;min-width:30px}
.syl svg{display:block;width:100%;height:22px;margin-bottom:3px}
.syl b{font-size:24px;font-weight:800;color:var(--teal);line-height:1.1}
.syl.tr b{color:var(--orange)}
.phr.on-dark .syl b{color:#fff}
.phr.on-dark .syl.tr b{color:#f3cf9c}
.phr.sm .syl b{font-size:20px}
.gloss{font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.dark .gloss .en{color:#d9ece9}
.gloss .zh{color:#3f4a48}

/* home */
.hero{background:var(--teal);color:#fff;margin:0 -16px;padding:0 16px 22px}
.hero .who{display:flex;justify-content:space-between;align-items:flex-start;padding-top:8px}
.hero small{font-size:13px;letter-spacing:1.4px;font-weight:700;opacity:.85}
.hero h1{font-size:27px;font-weight:800;margin:8px 0 6px;line-height:1.1}
.hero p{margin:0;font-size:16px;opacity:.92}
.hero p b{color:#f3d9a6}
.av{width:52px;height:52px;border-radius:26px;background:#f5d9a8;color:#5a3608;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:14px;background:#fff;border:1.5px solid var(--teal-line);padding:0 14px}
.search input{border:0;outline:0;font:inherit;font-size:16px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.hero .search{margin-top:16px;border-color:transparent}
.cov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cov>*{border-radius:12px;padding:9px 12px;background:#e6f1e9}
.cov b{display:block;color:var(--good);font-size:16px}
.cov span{font-size:13.5px;color:var(--muted)}
.cov .oc{background:#fdf0e1}.cov .oc b{color:var(--brown)}
.remind{display:flex;gap:14px;align-items:center;background:var(--cream);border:1px solid var(--cream-line);border-radius:18px;padding:16px}
.remind b{color:var(--brown);font-size:18px;display:block}
.prow{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.bed{width:58px;height:58px;border-radius:14px;background:var(--teal-soft);color:var(--teal);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;font-variant-numeric:tabular-nums}
.prow h3{margin:0 0 6px;font-size:19px;font-weight:700}
.plist{display:grid;gap:12px}
.plist button.card{transition:border-color .12s}
.plist button.card:active{border:2px solid var(--teal);padding:15px}
.card.hl{padding:15px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sechead h2{margin:0;font-size:21px;font-weight:800}

/* patient */
.phero{background:var(--teal);color:#fff;margin:0 -16px 16px;padding:0 16px 20px}
.phero .back{background:rgba(255,255,255,.14)}
..hero h1{font-size:27px;margin:12px 0 10px;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:17px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;background:rgba(255,255,255,.14)}
.chip.k{background:#f5d9a8;color:#4d2b0a}
.notes-box{background:var(--cream);border:1px solid var(--cream-line);border-radius:18px;padding:16px}
.notes-box p{margin:8px 0 0;font-size:16px;line-height:1.5;color:#3e3125}
.notes-box .by{font-size:12px;color:var(--faint);margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;min-height:104px}
.tile b{font-size:17px;font-weight:700}
.tile.warm{background:#fbf0ea;border-color:#f3dccd}
.tile.warm b{color:var(--brown)}

/* body parts / scale / choices */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.choice .zh{font-size:19px;font-weight:700}
.choice span{font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{background:var(--peach);border:2px solid var(--orange)}
.choice[aria-pressed="true"] .zh,.choice[aria-pressed="true"] span{color:var(--brown)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.scale button{height:48px;border-radius:12px;border:1.5px solid var(--line);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--peach);border:2px solid var(--orange);color:var(--brown)}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
textarea.note{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;resize:vertical;color:var(--ink);background:#fff}
label.fl{font-size:13px;font-weight:700;color:var(--muted);display:block;margin:12px 0 6px}

/* practise rows */
.prow2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ic{width:46px;height:46px;border-radius:23px;border:1.5px solid var(--teal-line);display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.ic svg{width:21px;height:21px}
.card.focus{border:2px solid var(--orange);background:#fff9f4}
.mic{width:96px;height:96px;border-radius:48px;background:var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto}
.tipbox{background:var(--cream);border:1px solid var(--cream-line);border-radius:18px;padding:16px}
.tipbox p{margin:8px 0 0;font-size:16px;line-height:1.5}

/* show (patient-facing) */
.big{display:flex;align-items:center;gap:20px;background:var(--peach);border-radius:26px;padding:20px 22px;color:var(--brown)}
.bigl{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#98a3a1}
.bigl.yes{background:var(--good);color:#fff}
.rxt{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.big .zh{font-size:40px;white-space:nowrap}
.rxhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
.rx{border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--peach);color:var(--brown)}
.rx .zh{font-size:19px;font-weight:700}
.rx>span:not(.zh):not(.rxl){font-size:13px}
.rx.no{background:#f1f3f3;color:#8a9694}
.rxl{display:inline-flex;align-items:center;gap:3px;margin-top:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;background:#fff;color:#7d8987}
.rxl.yes{background:var(--good);color:#fff}
.big .zh{font-size:46px;font-weight:700;line-height:1.1}
.big span{font-size:16px;font-weight:600}
.big.off{background:#f1f3f3;color:#98a3a1}

/* teach-back */
.dark{background:var(--teal);color:#fff;border-radius:20px;padding:18px}
.dark .eyebrow{color:#bfe0dc}
.dark .gloss{color:#d9ece9}.dark .gloss .zh{color:#fff}
.pick{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.pick .zh{font-size:19px;font-weight:700;color:#6c7876}
.pick span{font-size:13px;color:var(--muted)}
.pick svg.i{width:26px;height:26px;color:#6c7876}
.pick.ok{background:var(--good-soft);border:2px solid var(--good)}.pick.ok .zh,.pick.ok svg.i{color:var(--good)}
.pick.no{background:var(--bad-soft);border:2px solid var(--bad)}.pick.no .zh,.pick.no svg.i,.pick.no span{color:var(--bad)}
.pick .mk{position:absolute;top:6px;right:8px;width:16px;height:16px}
.res{border-radius:18px;padding:16px;border:1px solid}
.res h3{margin:0 0 6px;font-size:19px}
.res p{margin:0;font-size:15.5px;line-height:1.5}
.res.good{background:var(--good-soft);border-color:#c6e0cc}.res.good h3{color:var(--good)}
.res.part{background:var(--cream);border-color:var(--cream-line)}.res.part h3{color:var(--brown)}
.res.bad{background:var(--bad-soft);border-color:#efc9c5}.res.bad h3{color:var(--bad)}
.inner{background:#fff;border-radius:14px;padding:12px 14px;margin-top:12px}
.marks{font-size:14px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.marks button{color:var(--teal);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.dashed{border:1.5px dashed #d79a6e;border-radius:18px;padding:16px;background:#fff}
.dashed h3{margin:0 0 12px;color:var(--brown);font-size:19px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.saved{border:1.5px solid #9ccaa8;background:var(--good-soft);border-radius:18px;padding:16px}

/* help */
.person{display:flex;gap:14px;align-items:flex-start}
.person .av{width:56px;height:56px;font-size:18px}
.person .av.c{background:var(--teal-soft);color:var(--teal-2)}
.person h3{margin:0;font-size:19px}
.person .r{font-size:14.5px;color:var(--muted)}
.ok-t{color:var(--good);font-weight:600;font-size:14.5px}
.warn-t{color:#9a4b0c;font-weight:600;font-size:14.5px}
.tipcard{background:#fff;border-radius:12px;padding:12px 14px}
.tipcard small{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}

/* done */
.donehero{background:var(--good);color:#fff;margin:0 -16px 16px;padding:0 16px 20px}
.don.hero h1{font-size:27px;margin:6px 0 6px}
.check-li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.check-li:last-child{border:0}
.check-li b{font-size:17.5px}
.check-li div div{font-size:14px;color:var(--muted);margin-top:3px}

/* review */
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;text-align:left;width:100%;background:#fff}
.opt b{font-size:16px;display:block}
.opt span{font-size:13.5px;color:var(--muted)}
.opt[aria-pressed="true"]{border:2px solid var(--teal);background:var(--teal-soft)}

/* notes */
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{height:38px;padding:0 15px;border-radius:19px;border:1.5px solid var(--line);font-size:14.5px;font-weight:600;background:#fff}
.fchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.ncard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.ncard.prac{border:1.5px solid #e9cbb0}
.nnote{margin-top:10px;background:var(--cream);border-radius:10px;padding:8px 11px;font-size:14px;line-height:1.4;color:#4c3c2d}
.nnote b{color:var(--brown)}
.nmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mini{height:32px;padding:0 12px;border-radius:16px;border:1.5px solid var(--teal-line);display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;color:var(--teal);background:#fff}
.mini.g{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}
.dtag{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:6px;background:#f5ddb5;color:#4d2b0a;font-size:12px;font-weight:700;margin-bottom:6px}

/* tone guide */
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eef0ef}
.trow:last-of-type{border:0}
.tn{width:26px;height:26px;border-radius:13px;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.tl{flex:1;min-width:0}.tl b{font-size:16px}.tl div{font-size:13.5px;color:var(--muted)}
.tex{width:72px;flex:none}.tex b{font-size:18px;color:var(--teal);display:block}.tex small{font-size:12.5px;color:var(--muted)}
.tex svg{width:46px;height:22px;display:block}
.sheet-wrap{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap .dim{position:absolute;inset:0;background:rgba(16,28,28,.45)}
.sheet{position:relative;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px 28px;max-height:88%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:3px;background:#d5dbda;margin:0 auto 14px}
.x{width:38px;height:38px;border-radius:19px;background:#eef1f0;display:flex;align-items:center;justify-content:center;flex:none}

/* me */
.lang{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:16.5px}
.lang small{color:var(--muted);font-size:13.5px;display:block}
.radio{width:22px;height:22px;border-radius:11px;border:2px solid var(--teal-line);flex:none}
.lang[aria-checked="true"] .radio{border:7px solid var(--teal)}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#1d2b2a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;white-space:nowrap}


/* round 2 */
.syl b{text-align:center}
.gloss .zh,.gloss .en{display:block}
.gloss .en{margin-top:1px}
.signoff{text-align:right;font-size:11.5px;line-height:1.45;color:var(--faint);margin-top:12px}
.signoff b{font-weight:600;color:#8a7a68}
.av{position:relative}
.st{position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:8px;border:2.5px solid #fff}
.st.on,.dot.on{background:#2e9b55}.st.off,.dot.off{background:#c8443a}
.dot{width:9px;height:9px;border-radius:5px;display:inline-block;margin-right:5px}
.avail{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--muted)}
.avail span{display:inline-flex;align-items:center}
.markbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px}
.marks3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

 S.issue=v==='part'?`mixed up ${w.map(k=>NAMES[k]).join(', ')||'one part'} when asked when to take it`:v==='bad'?`pointed to ${w.map(k=>NAMES[k]).join(' and ')} when asked when to take it`:S.issue;

 v==='part'?`<div class="res part"><h3>Partly: just one thing to fix. You can do this.</h3><p>${okk.length?cap(okk.map(k=>NAMES[k]).join(' and '))+(okk.length>1?' are':' is')+' right. ':''}${w.length?`${p.He} pointed to <b>${w.map(k=>NAMES[k]).join(', ')}</b>. `:''}Re-explain only that part:</p>

 v==='bad'?`<div class="res bad"><h3>Not yet${w.length?`: ${p.he} pointed to ${w.map(k=>NAMES[k]).join(' and ')}`:''}</h3><p>The basics didn't land. That isn't your fault or ${p.hers}. Try once more, slowly, with the full-screen pictures. If it still doesn't land, get a speaker.</p>

/* laptop context panel and tone sheet */

 if(['patient','symptoms','practise','bedside','check','coming','show','help'].includes(s))return `<div class="card" style="margin-bottom:16px"><div class="person"><div class="bed" style="width:48px;height:48px;font-size:19px">${p.bed}</div><div><h3 style="font-size:17px">${p.name}, ${p.age}</h3><div class="r">${p.chips.join(' · ')}</div></div></div><div class="nnote" style="margin-top:12px">Call ${p.him} <span class="zh">${p.call}</span> (${p.callR}).</div></div><div class="card">${toneHead(D())}${toneRows(D())}<div class="nnote" style="margin-top:10px">${TNOTE[D()]}</div></div>`;

 return ''}

/* ================= render ================= */
const app=document.getElementById('app');
function render(top){const cur=tabOf(S.screen);const c=ctx();

app.addEventListener('click',e=>{const pr=e.target.closest('[data-prsel]');if(pr&&S.prSel!==+pr.dataset.prsel){S.prSel=+pr.dataset.prsel;render()}

 if(d.tones){if(app.clientWidth>=1100&&['notes','phrasebook','patient','symptoms','practise','bedside','coming'].includes(S.screen)){toast('Tone guide is on the right');return}S.sheet=d.tones;render();return}

 if(d.pain){S.pain=+d.pain;render()}

 if(d.pick){S.mark=null;S.picks[d.pick]=!S.picks[d.pick];const pairs=[['one','two'],['before','after']];for(const[a,c]of pairs){if(d.pick===a&&S.picks[a])S.picks[c]=0;if(d.pick===c&&S.picks[c])S.picks[a]=0}render()}
 if(d.mark){S.mark=d.mark;render()}
 if(d.word){const p=P();const ctxP=S.screen==='check'?ph('ask'):ph('line2');const opts=[ph('p1'),ph('p2'),ph('p3'),{zh:p.call,en:`what we call ${p.him}`,d:D(),s:p.greet.s.slice(0,2)}];
  S.word=d.word==='whole'?{...ctxP,whole:1}:opts[+d.word];S.save='saved';render();toast('Saved for handover review')}

 if(d.delward){S.me.wards.splice(+d.delward,1);render()}

 if(a==='close'){S.sheet=null;render()}
 if(a==='savediff'){S.save='pick';render()}
 if(a==='undo'){S.save='idle';S.word=null;render()}

 if(a==='request'){S.helpD=d.d;go('coming')}
 if(a==='savesym'){toast(`Symptoms saved to ${P().his} notes`);setTimeout(()=>back(),700)}
 if(a==='rec')toast('Recording works in the real app');
 if(a==='family')toast(`Note saved for the ${P().visit} visit`);
 if(a==='coach')toast('Coaching request sent');

 if(a==='tamil')toast('Mr Ramasamy\'s family translates. Tamil phrases are not in this prototype.');
 if(a==='editme'){if(S.editMe){for(const el of app.querySelectorAll('[data-mef]'))S.me[el.dataset.mef]=el.value.trim()||S.me[el.dataset.mef];toast('Work details saved')}S.editMe=!S.editMe;render()}
 if(a==='addward'){const el=document.getElementById('me-newward');const v=el&&el.value.trim();if(v){for(const f of app.querySelectorAll('[data-mef]'))S.me[f.dataset.mef]=f.value;S.me.wards.push(v);render()}}
 if(a==='lang'){S.langOpen=!S.langOpen;render()}
 if(a==='adddialect')toast('Add a language you speak');
});
app.addEventListener('input',e=>{const id=e.target.id;if(['q-home','q-notes','q-pb'].includes(id)){S.q[id]=e.target.value;render()}});

const SIZES={phone:[390,844],tablet:[820,1180],laptop:[1440,900]};

 const s=Math.min(1,avW/w,avH/h);dev.style.transform=`scale(${s})`;document.getElementById('stage').style.height=(h*s+28)+'px';

layout();render(true);
